[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-partman-py"
version = "0.1.0"
description = "Automated timeseries table partitioning and retention manager for PostgreSQL"
authors = [{ name = "txltedxgod", email = "seidoutakidzava@gmail.com" }]
dependencies = [
    "psycopg[binary]>=3.1.18",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "schedule>=1.2.1"
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
pg-partman = "pg_partman.main:main"
